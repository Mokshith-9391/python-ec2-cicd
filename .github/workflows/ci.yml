name: Python CI/CD

on:
  push:
    branches:
      - main

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest


  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Install SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

      - name: Add EC2 host to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh \
            -i ~/.ssh/ec2_deploy_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            'bash -se' << 'EOF'

          set -e

          echo "================================="
          echo "Starting deployment..."
          echo "================================="

          cd ~/python-ec2-cicd

          echo "Fetching latest code..."
          git fetch origin

          echo "Resetting to latest main..."
          git reset --hard origin/main

          echo "Installing Python dependencies..."
          /home/ubuntu/python-ec2-cicd/.venv/bin/python -m pip install -r requirements.txt

          echo "Restarting systemd service..."
          sudo systemctl restart python-app

          echo "Checking systemd service..."
          sudo systemctl is-active --quiet python-app

          echo "Systemd service is active."

          echo "Waiting for application to become ready..."

          for i in {1..10}; do

            if curl -fsS http://localhost:8000; then
              echo ""
              echo "================================="
              echo "Application is responding."
              echo "Deployment successful!"
              echo "================================="
              exit 0
            fi

            echo "Application not ready yet. Attempt $i/10..."
            sleep 2

          done

          echo "================================="
          echo "Application failed to become ready."
          echo "================================="

          echo "Systemd status:"
          sudo systemctl status python-app --no-pager -l

          echo "Application logs:"
          sudo journalctl -u python-app -n 30 --no-pager

          exit 1

          EOF